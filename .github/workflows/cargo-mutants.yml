name: cargo-mutants

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The job is read-only: checkout + build/test, plus upload-artifact (which uses
# the Actions runtime token, not GITHUB_TOKEN). Default GITHUB_TOKEN to the
# minimum scope.
permissions:
  contents: read

jobs:
  cargo-mutants:
    name: shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-mutants
      - name: Install ESBMC
        uses: ./.github/actions/install-esbmc
      - name: Baseline build and tests
        run: |
          cargo build --all
          cargo test --workspace
      - name: Run cargo-mutants shard
        continue-on-error: true
        run: |
          cargo mutants \
            --workspace \
            --test-workspace=true \
            --no-shuffle \
            -vV \
            --shard "${{ matrix.shard }}/8" \
            --sharding round-robin \
            --baseline=skip \
            --timeout 180 \
            --in-place \
            -- --workspace --all-targets
      - name: Upload mutants.out
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
