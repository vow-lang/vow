name: Arena verification

# `vow-runtime/verify/arena.c` is a standalone C harness that ESBMC proves on
# its own -- no compiler, no Rust build, no other job's artifacts. It is also
# the single longest step in CI: ~800s of a ~1800s pull request, more than the
# whole three-stage bootstrap. Running it on every pull request spent that on
# changes that cannot reach it: `vow-runtime/` is touched by ~8% of commits
# over the last year and ~22% over the last 40, and `vow-runtime/verify/` --
# the harness itself -- by under 2%. Even at the recent, runtime-heavy rate
# that is roughly four pull requests in five paying nothing for the proof.
#
# So it runs here instead, gated on the paths that feed it and repeated nightly
# regardless of what changed. The nightly run is what keeps the gate honest:
# even if the path list ever misses an input, the proof is never more than a
# day stale on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 06:29 UTC -- offset from cargo-mutants (02:17) and equivalence (04:41)
    # so the nightly jobs never contend for runners.
    - cron: "29 6 * * *"
  workflow_dispatch: {}

# Checkout, an ESBMC download, and a proof. `verify-macos` additionally
# uploads its measurement log via upload-artifact, which uses the Actions
# runtime token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Job-level `if:` on a classifier output rather than a top-level `paths:`
  # filter, matching ci.yml. A workflow that never starts leaves a required
  # status check Pending forever, whereas a job skipped by a condition reports
  # success -- so this stays correct if `verify` ever becomes required.
  #
  # `schedule` and `workflow_dispatch` carry no commit range, which the
  # classifier reports as `arena=true`. The nightly run therefore needs no
  # condition of its own.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      arena: ${{ steps.classify.outputs.arena }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the range have to be present for `git diff base...head`.
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_docs_only.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  verify:
    name: Arena primitive verification
    needs: changes
    if: needs.changes.outputs.arena == 'true'
    runs-on: ubuntu-latest
    # The proof took ~845s on a GitHub runner at ESBMC 8.1. Solver version
    # moves this a lot, so the ceiling is deliberately loose -- but it is a
    # ceiling, not a hang budget: a run that doubles is worth failing on.
    # Deliberately not restated per bump; the pin lives in install-esbmc.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ESBMC
        uses: ./.github/actions/install-esbmc
      - name: Arena verification runner tests
        run: python3 scripts/test_verify_arena.py
      - name: Arena primitive verification
        run: scripts/verify_arena.sh

  # Issue #1212: measure the arena proof's memory behavior on macOS/arm64
  # before gating on it. Darwin/XNU accounts virtual address space
  # differently from Linux -- ASLR slides, the dyld shared cache, and malloc
  # zones can inflate reported VSZ far beyond resident footprint -- so the
  # `ulimit -v 2000000` cap that scripts/verify_arena.sh enforces on Linux
  # (see vow-runtime/verify/Makefile for the per-ESBMC-version RSS table it
  # guards) has never been exercised against Darwin's accounting. This job
  # is advisory (`continue-on-error: true`) and stays that way until
  # docs/design/arena_macos_memory_profile.md records real numbers backing a
  # decision either way. See that doc for the current status.
  verify-macos:
    name: Arena primitive verification (macOS measurement)
    needs: changes
    if: needs.changes.outputs.arena == 'true'
    # Pinned, not macos-latest: a `macos-latest` run of this job dyld-aborted
    # on `esbmc --version` with "Library not loaded: .../libz3.5.1.dylib"
    # because that runner resolved a newer Homebrew z3 bottle than the ESBMC
    # macOS release links against. bootstrap.yml's bootstrap-macos and
    # release.yml's macOS leg already pin macos-15 for exactly this reason
    # (install-esbmc's macOS runtime deps drift with the runner image); this
    # job now matches them instead of rediscovering the same failure mode.
    runs-on: macos-15
    continue-on-error: true
    # Generous: Homebrew installing llvm@21 alone is slow on a cold macOS
    # runner, and this job runs the proof twice (uncapped, then capped) to
    # compare. Tighten once a real run's wall-clock is known.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ESBMC
        uses: ./.github/actions/install-esbmc
      - name: Confirm ESBMC reports before any cap
        run: esbmc --version

      # Isolated in one step (one shell) rather than via verify_arena.sh,
      # so a Darwin rejection of the cap doesn't abort the job before any
      # data is captured, and so the post-cap esbmc invocation observes the
      # same shell's limit -- ulimit does not persist across job steps.
      # `ulimit -a` / `sw_vers` / `uname -m` cost nothing and pin down
      # exactly which Darwin build produced the numbers below.
      - name: Probe ulimit -v support and post-cap dyld cost (Darwin)
        run: |
          set +e
          uname -m
          sw_vers
          ulimit -a
          ulimit -v 2000000
          echo "ulimit -v 2000000 exit status: $?"
          echo "ulimit -v readback: $(ulimit -v)"
          esbmc --version
          echo "esbmc --version under cap exit status: $?"
          exit 0

      # Uncapped baseline: what does the real proof cost with no ulimit at
      # all? Runs `make` directly rather than through verify_arena.sh, which
      # hardcodes the cap. Samples every running `esbmc` process's VSZ/RSS
      # (KiB, per `ps`) every second alongside /usr/bin/time -l's own
      # summary (macOS BSD time reports "maximum resident set size" in
      # *bytes* on its own line -- a different unit than the sampler).
      # `ps -p $(pgrep esbmc)` breaks silently if more than one PID matches
      # or none does, so this filters `ps -A` by command name instead.
      - name: Baseline peak RSS and VSZ (uncapped)
        run: |
          set +e
          (
            while true; do
              ts=$(date +%s)
              ps -A -o vsz=,rss=,ucomm= | awk -v ts="$ts" '$3 == "esbmc" { print ts, $1, $2 }'
              sleep 1
            done
          ) >> uncapped-sampler.log &
          sampler_pid=$!
          /usr/bin/time -l make -C vow-runtime/verify verify > uncapped-output.log 2>&1
          echo "uncapped proof exit status: $?"
          kill "$sampler_pid" 2>/dev/null
          wait "$sampler_pid" 2>/dev/null
          echo "--- uncapped-output.log (tail) ---"
          tail -n 40 uncapped-output.log
          echo "--- uncapped-sampler.log peak VSZ sample (ts vsz_kb rss_kb) ---"
          sort -k2 -n -r uncapped-sampler.log | head -n 1
          echo "--- uncapped-sampler.log peak RSS sample (ts vsz_kb rss_kb) ---"
          sort -k3 -n -r uncapped-sampler.log | head -n 1
          exit 0

      # The actual gate candidate: the real script, real `ulimit -v
      # 2000000`. Records whether it passes under the cap, and whether the
      # sampled VSZ during the run exceeded 2 GiB anyway (cap accepted by
      # the kernel but not enforced against this workload).
      - name: Capped peak RSS and VSZ (ulimit -v 2000000)
        run: |
          set +e
          (
            while true; do
              ts=$(date +%s)
              ps -A -o vsz=,rss=,ucomm= | awk -v ts="$ts" '$3 == "esbmc" { print ts, $1, $2 }'
              sleep 1
            done
          ) >> capped-sampler.log &
          sampler_pid=$!
          /usr/bin/time -l scripts/verify_arena.sh > capped-output.log 2>&1
          echo "capped proof exit status: $?"
          kill "$sampler_pid" 2>/dev/null
          wait "$sampler_pid" 2>/dev/null
          echo "--- capped-output.log (tail) ---"
          tail -n 40 capped-output.log
          echo "--- capped-sampler.log peak VSZ sample (ts vsz_kb rss_kb) ---"
          sort -k2 -n -r capped-sampler.log | head -n 1
          echo "--- capped-sampler.log peak RSS sample (ts vsz_kb rss_kb) ---"
          sort -k3 -n -r capped-sampler.log | head -n 1
          exit 0

      - name: Upload measurement logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arena-macos-memory-profile
          path: |
            uncapped-output.log
            uncapped-sampler.log
            capped-output.log
            capped-sampler.log
          if-no-files-found: warn
