# Enforces Conventional Commits on PR titles.
#
# Why the title and not the commits: the repo only allows squash merges, and the
# squash subject is taken verbatim from the PR title. So the PR title *is* the
# commit message that lands on main and gets linted by commitlint.yml.
#
# This job therefore runs commitlint itself, against the repo's own
# commitlint.config.cjs, rather than a second lookalike ruleset. Two rulesets
# gating one string is how "Cranelift I128 codegen" (#1079) passed review and
# then broke commitlint on main: subject-case is a commitlint rule that the
# generic PR-title actions do not check.
name: Lint PR title

# pull_request_target is required so the check also runs on fork PRs, and it
# makes the checkout resolve to the *base* commit — so a PR cannot weaken the
# ruleset it is being judged by. No PR code is checked out or executed, and the
# untrusted title is passed through the environment, never interpolated into a
# shell command.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      # Tag-pinned, not hash-pinned: a deliberate tradeoff for readability over the
      # marginal supply-chain hardening SHA-pinning would add.
      - uses: actions/checkout@v7.0.0 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0 # zizmor: ignore[unpinned-uses]
        with:
          node-version: lts/*
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@21 @commitlint/config-conventional@21 # zizmor: ignore[adhoc-packages]
      # Lint the subject as it will actually land: GitHub appends " (#N)" to the
      # squash subject, which is 8+ characters commitlint counts against
      # header-max-length on main but would not see in the bare title. Linting
      # the title alone lets a 98-character title pass here and fail there.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s (#%s)' "$PR_TITLE" "$PR_NUMBER" | npx commitlint --verbose
