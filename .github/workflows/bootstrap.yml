name: Bootstrap

# The three-stage bootstrap and its SHA-256 fixed-point check, moved off the
# pull-request path. Together the two jobs are ~900s of runner time and, once
# `build-and-test` was cut to ~280s, the Linux one alone *was* the critical
# path -- a pull request waited on it and on nothing else.
#
# It runs on every push to `main` as well as nightly. That matters more than
# the cron: a self-hosting break is attributed to the merge commit that caused
# it, not to a day of commits. The nightly run is the backstop for anything
# push-triggered misses (a force-push, a skipped run, an infrastructure blip).
#
# The trade this accepts: a pull request can no longer tell you that the
# compiler still compiles itself byte-identically. That is caught one merge
# later instead. `build-and-test` still builds the concatenated self-hosted
# compiler on both platforms, so a change that stops it compiling at all is
# still a pull-request failure -- what moves here is specifically the
# fixed-point guarantee and Stage 1/2 ESBMC verification.
on:
  push:
    branches: [main]
  schedule:
    # 03:53 UTC -- offset from cargo-mutants (02:17), equivalence (04:41) and
    # arena-verify (06:29) so the nightly jobs never contend for runners.
    - cron: "53 3 * * *"
  workflow_dispatch: {}

# Checkout, a toolchain, an ESBMC download, and a build. Nothing here writes.
permissions:
  contents: read

jobs:
  # Same docs-only gate as ci.yml: a prose commit cannot break a bootstrap.
  # Job-level `if:` rather than a top-level `paths-ignore:`, so a skipped job
  # reports success instead of leaving a status check Pending forever.
  #
  # `schedule` and `workflow_dispatch` carry no commit range, which
  # `ci_docs_only.py` reports as `code=true` -- so the nightly run needs no
  # condition of its own.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the range have to be present for `git diff base...head`.
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_docs_only.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  bootstrap:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Runs scripts/bootstrap.sh end-to-end so a bootstrap regression
    # (failing Stage 1/2 verification, or a broken SHA-256 fixed point)
    # is caught. Stage 3 skips ESBMC to roughly halve wall time;
    # verification does not affect codegen, so the fixed-point check
    # remains meaningful.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install ESBMC
        uses: ./.github/actions/install-esbmc
      - name: Bootstrap (Stages 1-2 verify, Stage 3 fixed-point check)
        run: scripts/bootstrap.sh --stage3-no-verify
      - name: Compiler test suite, both compilers (equivalence tier 1)
        # This is blocking but nightly rather than per-PR while #1171 keeps the
        # self-hosted suite outside the pull-request latency budget. Running it
        # here also compares the verified fixed point, not the weaker stage-1
        # concatenated compiler available in ci.yml.
        #
        # Bounded separately from the job so a #1171 overrun is attributable to
        # this step rather than silently eating the later steps' budget.
        timeout-minutes: 40
        run: |
          set +e
          target/release/vow test compiler/ > /tmp/rust_test.json
          rust_exit=$?
          # The address-space cap applies to the self-hosted binary only, as in
          # full_test.sh's run_self: capping the Rust compiler or python3 turns
          # a memory limit into a spurious parity failure.
          ( ulimit -v 2000000; build/vowc test compiler/ ) > /tmp/self_test.json
          self_exit=$?
          set -e
          python3 scripts/parity.py test /tmp/rust_test.json /tmp/self_test.json \
            "$rust_exit" "$self_exit"
      - name: Verifier-evaluation suite (self-hosted)
        # Holds the fixed-point self-hosted compiler to the same exact
        # ground-truth blame/vow_id corpus as the Rust verifier.
        run: |
          ulimit -v 2000000
          python3 scripts/verify_eval.py --verifier build/vowc --output-dir /tmp/verify-eval-self

  bootstrap-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Runs the same verified three-stage bootstrap as Linux: Stages 1-2 verify
    # with the arm64 macOS ESBMC artifact, while Stage 3 skips ESBMC to roughly
    # halve wall time. Verification does not affect codegen, so the SHA-256
    # fixed-point check remains meaningful.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install ESBMC
        uses: ./.github/actions/install-esbmc
      - name: Bootstrap (Stages 1-2 verify, Stage 3 fixed-point check)
        run: scripts/bootstrap.sh --stage3-no-verify
