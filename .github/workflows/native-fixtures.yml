name: Native fixture directives

# Pull-request-time copy of the `tests/verify-native` checks that `full-test.yml` runs only after
# a merge (Section 4g of `scripts/full_test.sh`) and of its weak-contract gate (Section 8c).
# Before this workflow a fixture with a wrong `// TEST:` directive (`counterexample-vow-id`,
# `counterexample-fn`, `counterexample-blame`, `unknown-reason`, `replay-skipped`, ...), or a
# contract that scored as weak (#1795), passed every pull-request check and turned `main` red at
# the next push; four times in twelve hours.
#
# Both checks are standalone scripts that mirror the loops of `full_test.sh` (too large a file to
# edit under the file token budget); `scripts/test_check_native_fixtures.py` fails when the
# directives they read drift apart:
#
#   * `scripts/check_native_fixtures.sh` runs `vowc verify --backend native` over
#     `tests/verify-native/{pass,fail,unknown,skip,contracts}` and compares each result with the
#     fixture's directives, byte-identity under `VOW_VERIFY_NO_SLICE` / `VOW_VERIFY_NO_INCREMENTAL`
#     and the cold/warm result cache included;
#   * `scripts/check_contract_quality.sh` is the weak/tautological-contract ratchet (baseline 0)
#     over `compiler/main.vow` and `compiler/module_io.vow`.
#
# Only Bitwuzla is installed, not ESBMC: the native backend is the only thing under test, and
# `native-esbmc-diff.yml` already differences it against ESBMC. The compiler is built with
# the Rust stage-0 compiler alone (Stage 1 of `bootstrap.sh`), as `full_test.sh` does.
#
# The `paths:` filter stays off changes the checks cannot observe, and `main` has no required
# checks, so a workflow skipped by `paths:` cannot leave a required check Pending.
on:
  pull_request:
    branches: [main]
    paths:
      - "compiler/**"
      - "tests/verify-native/**"
      - "scripts/check_native_fixtures.sh"
      - "scripts/check_contract_quality.*"
      - "scripts/test_check_native_fixtures.py"
      - "scripts/full_test.sh"
      - ".github/actions/install-bitwuzla/**"
      - ".github/workflows/native-fixtures.yml"
  workflow_dispatch:

# A new push to a pull request supersedes its running job.
concurrency:
  group: native-fixtures-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_docs_only.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  directives:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Native fixture directives and weak-contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Bitwuzla
        uses: ./.github/actions/install-bitwuzla
      - name: Build the self-hosted compiler
        # Stage 1 of bootstrap.sh, as full_test.sh builds it: the fixed point is not under test,
        # so Stages 2 and 3 (about 80 s) are skipped.
        run: |
          cargo build --all --release
          mkdir -p build
          ./target/release/vow build --no-verify compiler/main.vow -o build/vowc
      - name: Weak-contract gate
        run: scripts/check_contract_quality.sh build/vowc
      - name: Fixture directives over tests/verify-native
        # Runs even when the gate above failed, so one run reports both.
        if: ${{ !cancelled() }}
        run: scripts/check_native_fixtures.sh --jobs 4 --require-solver build/vowc
      - name: Callee summary fixtures
        if: ${{ !cancelled() }}
        run: bash tests/verify-native/summary/run.sh build/vowc
      - name: Proven-callee trust fixtures
        if: ${{ !cancelled() }}
        run: bash tests/verify-native/trust/run.sh build/vowc
      - name: Directive parity with full_test.sh
        if: ${{ !cancelled() }}
        run: python3 scripts/test_check_native_fixtures.py
