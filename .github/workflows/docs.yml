name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/spec/**"
      - "website/**"
      - "scripts/build_docs_site.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/spec/**"
      - "website/**"
      - "scripts/build_docs_site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run. Pull request
# builds never deploy, so they get their own cancellable group per ref.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r website/requirements.txt
      - name: Assemble site source from canonical spec
        run: python3 scripts/build_docs_site.py
      - name: Build site (strict)
        run: zensical build --strict --config-file website/mkdocs.yml
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
