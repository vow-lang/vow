name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/spec/**"
      - "docs/verifier-discipline.md"
      - "docs/adr/**"
      - "website/**"
      - "scripts/build_docs_site.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/spec/**"
      - "docs/verifier-discipline.md"
      - "docs/adr/**"
      - "website/**"
      - "scripts/build_docs_site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress run. Pull request
# builds never deploy, so they get their own cancellable group per ref.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r website/requirements.txt
      - name: Assemble site source from canonical spec
        run: python3 scripts/build_docs_site.py
      - name: Build site (strict)
        run: mkdocs build --strict --config-file website/mkdocs.yml
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: website/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
