name: Release

# Hybrid semantic-release, batched on a weekly schedule (Sundays 00:00 UTC):
# `plan` runs semantic-release in dry-run to decide whether a release is due
# and at what version, based on Conventional Commits accumulated on main
# since the last release; `build-package` builds the full cross-platform
# toolchain (Linux x86_64/aarch64 + macOS, with ESBMC verification) at that
# version; `publish` runs semantic-release for real to tag, generate the
# CHANGELOG + notes, and create the GitHub Release with the pre-built
# toolchains attached. No-op if nothing releasable landed that week. Use
# workflow_dispatch to cut a release on demand between scheduled runs.
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Decide release version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      published: ${{ steps.sr.outputs.new_release_published }}
      version: ${{ steps.sr.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: semantic-release (dry run — compute next version)
        id: sr
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/exec@7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-package:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep each four-line entry contiguous: the workflow-shape test
          # parses these blocks and permits comments between entries.
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
            verify: true
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            verify: true
          - os: macos
            arch: aarch64
            runner: macos-15
            verify: true
          # The upstream macOS artifact is arm64-only.
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            verify: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set workspace version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash .github/semantic-release/set-version.sh "$VERSION"
      # `matrix.verify` is true only where the action has a checksum-pinned
      # archive; all other legs keep the fixed-point check with --no-verify.
      - name: Install ESBMC
        if: matrix.verify
        uses: ./.github/actions/install-esbmc
      - name: Build Rust artifacts
        run: cargo build --all --release
      - name: Bootstrap compiler
        run: |
          if [ "${{ matrix.verify }}" = "true" ]; then
            scripts/bootstrap.sh --skip-cargo
          else
            scripts/bootstrap.sh --skip-cargo --no-verify
          fi
      - name: Package toolchain
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          scripts/package-toolchain.sh \
            --version "$VERSION" \
            --os "${{ matrix.os }}" \
            --arch "${{ matrix.arch }}" \
            --output-dir release
      - name: Smoke-test packaged toolchain
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          asset="vow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf "release/$asset" -C "$tmp"
          prefix="$tmp/vow-$VERSION"
          runtime_lib="$prefix/lib/vow/libvow_runtime.a"
          shim_lib="$prefix/lib/vow/libvow_clif_shim.a"
          for packaged_lib in "$runtime_lib" "$shim_lib"; do
            if [ ! -f "$packaged_lib" ]; then
              echo "::error::Missing packaged library: $packaged_lib"
              exit 1
            fi
          done
          cat > "$tmp/hello.vow" <<'EOF'
          module Hello

          fn main() -> i32 [io] {
              print_str("Hello, world!");
              0
          }
          EOF
          "$prefix/bin/vow" --help > /dev/null
          (
            cd "$tmp"
            VOW_RUNTIME_PATH="$runtime_lib" \
              VOW_CLIF_SHIM_PATH="$shim_lib" \
              "$prefix/bin/vow" build --no-verify hello.vow -o hello
            ./hello
          )
      - name: Upload toolchain package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/vow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            release/vow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [plan, build-package]
    if: needs.plan.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Download packaged toolchains
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: toolchain-*
          path: release
          merge-multiple: true
      - name: semantic-release (publish)
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/exec@7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
