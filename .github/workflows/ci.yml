name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here is read-only: checkout + build/test, plus a Codecov upload
# that authenticates with its own CODECOV_TOKEN (not GITHUB_TOKEN). Default the
# GITHUB_TOKEN to the minimum scope so no job gets more than it uses.
permissions:
  contents: read

jobs:
  # Gate for every job below. A commit that touches nothing but prose cannot
  # regress a compiled artifact, and the jobs below are a Linux and a macOS
  # build. `ci_docs_only.py` decides what counts as prose -- the same
  # classifier gates bootstrap.yml and arena-verify.yml. Note that Markdown
  # under `docs/spec/**` and
  # `skills/**` counts as *code*: `generate_help.py` copies the spec into the
  # compiler sources, the JSON schemas beside it are `include_str!`-ed into the
  # binaries, and a `cargo test` in `vow/src/skill.rs` asserts the `skills/`
  # mirror matches the compiler-embedded skill.
  #
  # Job-level `if:` rather than a top-level `paths-ignore:`. A workflow that
  # never starts leaves a required status check Pending forever, whereas a job
  # skipped by a condition reports success. `main` has no required checks today
  # (its ruleset covers deletion and non-fast-forward only), so this keeps the
  # gate correct if that ever changes.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the range have to be present for `git diff base...head`.
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_docs_only.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: bench/uv.lock
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov
      - name: Install ESBMC
        uses: ./.github/actions/install-esbmc
      - run: cargo build --all
      - name: Verifier-evaluation unit tests
        run: python3 scripts/test_verify_eval.py
      - name: Candidate isolation unit tests
        run: python3 scripts/test_candidate_isolation.py
      - name: Equivalence runner unit tests
        run: python3 scripts/test_equivalence.py
      - name: Adversarial pair-review unit tests
        run: python3 scripts/test_pair_review.py
      - name: Verifier-runtime differential unit tests
        run: python3 scripts/test_verifier_runtime.py
      - name: Compiler parity comparator unit tests
        run: python3 scripts/test_parity.py
      - name: CI path-classifier unit tests
        run: python3 scripts/test_ci_docs_only.py
      - name: CI workflow-shape unit tests
        run: python3 scripts/test_bootstrap_workflow.py
      - name: Install-ESBMC action unit tests
        run: python3 scripts/test_install_esbmc_action.py
      - name: Docs site link-rewrite unit tests
        run: python3 scripts/test_build_docs_site.py
      - name: Benchmark skeleton fidelity unit tests
        run: |
          python3 scripts/test_benchmark_contracts.py
          uv run --project bench --locked python -m unittest discover -s bench -p 'test_*.py'
          PYTHONPATH=euler python3 -m unittest discover -s euler -p 'test_*.py'
      - name: Scratch-tree signal-cleanup tests
        run: python3 scripts/test_scratch_cleanup.py
      - name: Verifier-evaluation suite (#334)
        # Asserts the labelled corpus in tests/verify* against ground-truth
        # blame/vow_id, with false-accepts (incl. vacuous proofs) failing the
        # build under a SOUNDNESS banner. ESBMC is on PATH from the step above.
        # Reuse the debug binary produced by the preceding `cargo build --all`.
        run: python3 scripts/verify_eval.py --verifier ./target/debug/vow --output-dir /tmp/verify-eval
      - name: Build concatenated self-hosted compiler
        run: |
          bash scripts/concat_vow.sh clif > /tmp/compiler_clif.vow
          ulimit -v 2000000
          ./target/debug/vow build --no-verify --no-cache /tmp/compiler_clif.vow -o /tmp/vowc_concat
          test -x /tmp/vowc_concat
      - run: cargo llvm-cov --all --lcov --output-path lcov.info
      - run: cargo clippy --all -- -D warnings
      - run: cargo fmt --all -- --check
      # Phase 3 (issue #199) — non-blocking region-pass surface scan against
      # `compiler/*.vow`. Surfaces RegionConflict diagnostics for the
      # Phase 5 source fix-ups without failing the build (per the issue's
      # "non-blocking warnings" requirement). Spec §4.4 is still strict —
      # the rejection happens in actual builds, just not in this informational
      # scan.
      - name: Region inference surface scan (non-blocking)
        continue-on-error: true
        run: |
          bash scripts/concat_vow.sh ir > /tmp/region_scan.vow
          ./target/debug/vow build --no-verify --dump-ir /tmp/region_scan.vow > /tmp/region_scan.out 2> /tmp/region_scan.err || true
          if grep -q "RegionConflict" /tmp/region_scan.out /tmp/region_scan.err 2>/dev/null; then
            echo "::warning::RegionConflict diagnostics detected in compiler/*.vow (Phase 5 source fix-ups needed)"
            grep -A2 "RegionConflict" /tmp/region_scan.out /tmp/region_scan.err | head -40
          else
            echo "no RegionConflict warnings in compiler/*.vow"
          fi
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: vow-lang/vow
          files: lcov.info
          # CODECOV_TOKEN is not exposed to Dependabot or fork PRs, and Codecov
          # rejects tokenless uploads on a protected branch. Only hard-fail CI
          # when a token is actually available, so those PRs are not blocked by
          # an upload they can never authenticate.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

  # ─── macOS ────────────────────────────────────────────────────────
  #
  # Advisory via continue-on-error while platform-specific test issues are
  # shaken out (#501). The macOS bootstrap lives in bootstrap.yml with its
  # Linux counterpart.

  build-and-test-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --all
      - name: Build concatenated self-hosted compiler
        run: |
          bash scripts/concat_vow.sh clif > /tmp/compiler_clif.vow
          ./target/debug/vow build --no-verify --no-cache /tmp/compiler_clif.vow -o /tmp/vowc_concat
          test -x /tmp/vowc_concat
      - run: cargo test --all
      - run: cargo clippy --all -- -D warnings
      - run: cargo fmt --all -- --check
