name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - 'announcements/**'
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip drafts, dependabot, and pmatos's own PRs — Claude review is
    # expensive and not useful for any of these.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'pmatos' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: |
            google-labs-jules
            dependabot[bot]
            autofix-ci

          prompt: '/code-review xhigh --comment ${{ github.event.pull_request.number }}'

          use_sticky_comment: false
          include_fix_links: true
          track_progress: false

          claude_args: |
            --model claude-sonnet-5
            --permission-mode auto
