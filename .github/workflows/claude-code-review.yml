name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - 'announcements/**'
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip drafts and dependabot — Claude review is expensive and not useful
    # for either case.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: |
            google-labs-jules
            dependabot[bot]
            autofix-ci

          prompt: '/code-review xhigh --comment ${{ github.event.pull_request.number }}'

          use_sticky_comment: false
          include_fix_links: true
          track_progress: false

          claude_args: |
            --model claude-sonnet-5
            --permission-mode auto
