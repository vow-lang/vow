name: Native verifier oracles

# Two independent checks on `vowc verify --backend native` (epic #1398, #1431):
#
#   * the verifier-versus-runtime differential (`scripts/verifier_runtime.py`):
#     a `Verified` program must not violate a contract when run in debug mode,
#     and every counterexample must replay;
#   * the Z3 cross-check (`scripts/z3_crosscheck.py`): every query the native
#     backend sends to Bitwuzla is re-run under Z3 and a sat/unsat
#     disagreement fails the run.
#
# Both sweep two generated corpora next to the fixtures (#1473): the #905
# equivalence axis for query volume, and the verifier axis
# (`gen_corpus.py --axis verifier`), whose `main` calls each contracted function
# past a collection or loop boundary so the runtime is a soundness oracle, with
# an honest-control class that must stay `Verified`. Known disagreements are
# tracked by issue number in `scripts/gen_verifier_corpus.py`.
#
# Z3 is CI-only: it is installed by this workflow and nowhere else, and no
# product code depends on it. Neither oracle needs ESBMC, so the compiler is
# built with `bootstrap.sh --no-verify`.
#
# Off the pull-request path, like bootstrap.yml and full-test.yml: the job is
# bootstrap-class in runtime. A false proof is attributed to the merge that
# introduced it because it runs on every push to `main`; the nightly run is the
# backstop and rotates the generated-corpus seed.
on:
  push:
    branches: [main]
  schedule:
    # 05:37 UTC -- clear of cargo-mutants (02:17), bootstrap (03:53),
    # equivalence (04:41), arena-verify (06:29) and full-test (07:20).
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Generated-corpus seed (default 1431 for the equivalence axis, 1473 for the verifier axis)
        required: false
        type: string

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_docs_only.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  oracles:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Oracles (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    env:
      # Shared by every step that runs an oracle; the harness reads it.
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Bitwuzla
        uses: ./.github/actions/install-bitwuzla
      - name: Install Z3
        uses: ./.github/actions/install-z3
      - name: Build the self-hosted compiler
        # Verification does not change codegen, so the fixed point is as
        # meaningful as in bootstrap.yml; ESBMC is simply not involved here.
        run: scripts/bootstrap.sh --no-verify
      - name: Generate the seeded corpora
        id: corpus
        # Pinned on pushes so a red run is reproducible from the commit alone;
        # date-derived on the nightly so the corpora keep moving; an explicit
        # input on a manual run. The seed is echoed either way, and the
        # generators are deterministic from it, so `gen_corpus.py --axis
        # verifier --seed <seed>` rebuilds exactly what a red run swept.
        env:
          INPUT_SEED: ${{ github.event.inputs.seed }}
        run: |
          if [ -n "$INPUT_SEED" ]; then
            equivalence_seed="$INPUT_SEED"
            verifier_seed="$INPUT_SEED"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            equivalence_seed="$(date -u +%Y%m%d)"
            verifier_seed="$equivalence_seed"
          else
            equivalence_seed=1431
            verifier_seed=1473
          fi
          echo "equivalence-axis seed: $equivalence_seed"
          echo "verifier-axis seed: $verifier_seed"
          python3 scripts/gen_corpus.py --seed "$equivalence_seed" --count 100 \
            --output-dir "$RUNNER_TEMP/generated/equivalence"
          python3 scripts/gen_corpus.py --axis verifier \
            --seed "$verifier_seed" --count 300 \
            --output-dir "$RUNNER_TEMP/generated/verifier"
          echo "dir=$RUNNER_TEMP/generated" >> "$GITHUB_OUTPUT"
      - name: Native verifier versus runtime
        env:
          CORPUS: ${{ steps.corpus.outputs.dir }}
        run: |
          python3 scripts/verifier_runtime.py --backend native \
            --shard "$SHARD" --min-checked 60 \
            --extra-root "$CORPUS" \
            --output-dir "$RUNNER_TEMP/verifier-runtime"
      - name: Z3 cross-check of the native queries
        # Runs even when the differential above failed, so one run reports
        # both oracles.
        if: ${{ !cancelled() }}
        env:
          CORPUS: ${{ steps.corpus.outputs.dir }}
        run: |
          python3 scripts/z3_crosscheck.py \
            --shard "$SHARD" --min-agreed 250 \
            --extra-root "$CORPUS" \
            --output-dir "$RUNNER_TEMP/z3-crosscheck"
      - name: Summarize the generated corpus
        # Surfaces the class/regime/verdict table in the job summary, so a reader
        # sees what the generated programs measured (and which controls are
        # tracked gaps) without downloading the artifact.
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "verifier-runtime" / "results.json"
          if not path.exists():
              print("### Shard: the verifier-runtime differential produced no results.json")
          else:
              d = json.loads(path.read_text())
              print(f"### Shard {os.environ['SHARD']}: generated verifier corpus")
              print()
              print("| class / regime: verdict | programs |")
              print("|---|---|")
              for key, count in sorted(d.get("generated_outcomes", {}).items()):
                  print(f"| {key} | {count} |")
          PY
      - name: Upload oracle results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-oracle-shard-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/verifier-runtime/results.json
            ${{ runner.temp }}/z3-crosscheck/results.json
            ${{ runner.temp }}/z3-crosscheck/queries/
          if-no-files-found: warn
