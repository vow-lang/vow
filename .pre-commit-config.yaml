default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: staged-file-token-limit
        name: staged authored files fit the 5,000-token budget
        entry: python3 scripts/check_staged_file_tokens.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: spec-parts-assembled
        name: docs/spec assembled files match docs/spec/src parts
        entry: python3 scripts/spec_assemble.py --check
        language: system
        pass_filenames: false
        files: ^docs/spec/(src/|(cli|grammar|errors|contracts)\.md$|operations\.json$)
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        exclude: ^website/mkdocs\.yml$
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.46.1
    hooks:
      - id: typos
        entry: typos
        args: []
        exclude: ^(CHANGELOG\.md|docs/audit-20260610/vow-analysis\.md)$

  - repo: https://github.com/jsh9/pydoclint
    rev: 0.8.4
    hooks:
      - id: pydoclint

  # commitlint, not a lookalike conventional-commit checker: this is the same
  # engine and the same commitlint.config.cjs that commitlint.yml runs on main,
  # so a message that passes here cannot fail there.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21"]
        # Lint the message file git actually hands the hook. The upstream hook
        # defaults to reading .git/COMMIT_EDITMSG, which breaks `pre-commit run
        # --commit-msg-filename` and anything that stages a message elsewhere.
        pass_filenames: true
